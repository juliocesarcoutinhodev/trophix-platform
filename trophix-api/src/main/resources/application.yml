spring:
  application:
    name: trophix-api
  profiles:
    active: dev
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:trophix}
    password: ${RABBITMQ_PASSWORD:trophix}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
          stateless: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: ${GOOGLE_AI_MODEL:gemini-3.6-flash}
          temperature: 0.3
          # Desativado temporariamente p/ teste: o Search Grounding consome quota
          # premium e retorna 429 com chave free/temporaria.
          # google-search-retrieval: true
          # include-server-side-tool-invocations: true

server:
  port: 8080

trophix:
  sidecar:
    base-url: ${TROPHIX_SIDECAR_BASEURL:http://localhost:3000}
    connect-timeout: 2s
    read-timeout: 5s
    circuit-breaker:
      failure-threshold: 5
      open-timeout: 30s
      half-open-max-calls: 3
  jwt:
    secret: ${JWT_SECRET}
    # Access token (JWT) — curto; a sessão é mantida pelo refresh token opaco.
    expiration: PT1H
  refresh-token:
    # TTL absoluto do refresh token (cookie + persistência). PT0S no idle-timeout
    # desabilita a expiração por inatividade.
    expiration: PT720H
    idle-timeout: PT0S
  password-reset:
    # TTL do token de redefinição de senha (single-use) enviado por e-mail.
    token-ttl: PT1H
    # Base da URL do front-end para o link "redefinir senha" (/reset-password?token=).
    frontend-url: ${TROPHIX_WEB_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@trophix.com}
  forums:
    # Base da URL do front-end para os links de e-mail do fórum (/forums/topics/{id}).
    frontend-url: ${TROPHIX_WEB_URL:http://localhost:4200}
  news:
    # Agregador de notícias (módulo news): fontes RSS/Atom e frequência do worker.
    refresh-interval-ms: 1800000
    initial-delay-ms: 20000
    sources:
      - name: PlayStation Blog
        url: https://blog.playstation.com/feed/
      - name: MeuPlayStation
        url: https://meups.com.br/feed/
      - name: IGN Brasil
        url: https://br.ign.com/feed.xml
  minio:
    # MinIO (S3-compatible) — armazenamento de imagens de guias e avatares.
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:trophix-media}
    # Base usada para montar a URL pública (pode ser um CDN/reverse proxy).
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  cors:
    allowed-origin: ${TROPHIX_CORS_ORIGIN:http://localhost:4200}
  rate-limit:
    enabled: true
    trust-forwarded-header: false
    limits:
      auth:
        capacity: 10
        refill-per-minute: 20
      public-read:
        capacity: 60
        refill-per-minute: 120
      default:
        capacity: 300
        refill-per-minute: 600