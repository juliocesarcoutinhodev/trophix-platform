spring:
  application:
    name: trophix-api
  profiles:
    active: dev
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

trophix:
  sidecar:
    base-url: http://localhost:3000
    connect-timeout: 2s
    read-timeout: 5s
    circuit-breaker:
      failure-threshold: 5
      open-timeout: 30s
      half-open-max-calls: 3
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT24H
  cors:
    allowed-origin: http://localhost:4200