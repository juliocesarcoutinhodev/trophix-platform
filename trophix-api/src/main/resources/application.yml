spring:
  application:
    name: trophix-api
  profiles:
    active: dev
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:trophix}
    password: ${RABBITMQ_PASSWORD:trophix}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
          stateless: true

server:
  port: 8080

trophix:
  sidecar:
    base-url: http://localhost:3000
    connect-timeout: 2s
    read-timeout: 5s
    circuit-breaker:
      failure-threshold: 5
      open-timeout: 30s
      half-open-max-calls: 3
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT24H
  cors:
    allowed-origin: http://localhost:4200