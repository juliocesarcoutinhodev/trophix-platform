services:
  postgres:
    image: postgres:18
    container_name: trophix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trophix}
      POSTGRES_USER: ${POSTGRES_USER:-trophix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trophix}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trophix} -d ${POSTGRES_DB:-trophix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: trophix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-trophix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-trophix}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  psn-sidecar:
    build: ./trophix-psn-sidecar
    container_name: trophix-psn-sidecar
    environment:
      NPSSO_TOKEN: ${NPSSO_TOKEN:?Defina NPSSO_TOKEN no arquivo .env da raiz}
      TROFEUS_CACHE_TTL_MS: ${TROFEUS_CACHE_TTL_MS:-600000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: trophix-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres-data: