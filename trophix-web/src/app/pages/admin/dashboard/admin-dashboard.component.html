<div>

  <div class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
    <div class="rounded-xl border border-slate-800 bg-slate-950 p-6">
      <h3 class="text-sm font-medium text-slate-400">Novos Usuários (Hoje)</h3>
      <p class="mt-2 text-3xl font-bold text-slate-100">{{ newUsersCount() }}</p>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-950 p-6">
      <h3 class="text-sm font-medium text-slate-400">Guias Pendentes</h3>
      <p class="mt-2 text-3xl font-bold text-amber-500">{{ pendingGuidesCount() }}</p>

    <div class="rounded-xl border border-slate-800 bg-slate-950 p-6">

      <p class="mt-2 text-3xl font-bold text-violet-400">{{ syncsCount() }}</p>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-950 p-6">
      <h3 class="text-sm font-medium text-slate-400">Denúncias Abertas</h3>
      <p class="mt-2 text-3xl font-bold text-red-400">{{ reportsCount() }}</p>
