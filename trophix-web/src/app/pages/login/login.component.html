<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4">
  <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-black tracking-tight text-slate-100">Entrar no TROPHIX</h1>
      <p class="mt-1 text-sm text-slate-400">Acesse com o e-mail cadastrado</p>
    </div>

    @if (error()) {
      <p class="mb-4 rounded-lg border border-red-900 bg-red-950/40 px-4 py-2.5 text-sm text-red-400">
        {{ error() }}
      </p>
    }

    <form (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-slate-300">E-mail</label>
        <input
          id="email"
          type="email"
          required
          [(ngModel)]="email"
          name="email"
          class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-600/30"
          placeholder="voce@exemplo.com"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-slate-300">Senha</label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            required
            [(ngModel)]="password"
            name="password"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 pr-10 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-600/30"
            placeholder="••••••••"
          />
          <button 
            type="button" 
            (click)="togglePasswordVisibility()" 
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-300"
          >
            @if (showPassword()) {
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            } @else {
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input
            id="remember-me"
            name="remember-me"
            type="checkbox"
            [(ngModel)]="rememberMe"
            class="h-4 w-4 rounded border-slate-700 bg-slate-950 text-violet-600 focus:ring-violet-500 focus:ring-offset-slate-900"
          />
          <label for="remember-me" class="ml-2 block text-sm text-slate-300">
            Lembrar-me
          </label>
        </div>
        <a routerLink="/forgot-password" class="text-sm font-semibold text-violet-400 hover:text-violet-300">Esqueceu a senha?</a>
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-violet-600 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-400">
      Ainda não tem conta?
      <a routerLink="/register" class="font-semibold text-violet-400 hover:text-violet-300">Criar conta</a>
    </p>
  </div>
</main>
