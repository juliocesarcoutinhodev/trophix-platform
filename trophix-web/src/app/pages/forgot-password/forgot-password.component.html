<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4">
  <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-black tracking-tight text-slate-100">Recuperar Senha</h1>
      <p class="mt-1 text-sm text-slate-400">Informe seu e-mail para receber um link de redefinição</p>
    </div>

    @if (error()) {
      <p class="mb-4 rounded-lg border border-red-900 bg-red-950/40 px-4 py-2.5 text-sm text-red-400">
        {{ error() }}
      </p>
    }

    @if (success()) {
      <div class="mb-4 rounded-lg border border-green-900 bg-green-950/40 px-4 py-4 text-center">
        <svg class="mx-auto mb-2 h-8 w-8 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-sm font-medium text-green-400">Link enviado com sucesso!</p>
        <p class="mt-1 text-sm text-green-500/80">Verifique sua caixa de entrada (e a pasta de spam).</p>
      </div>
      <a routerLink="/login" class="block w-full rounded-lg border border-slate-700 bg-slate-800 py-2.5 text-center text-sm font-semibold text-white transition-colors hover:bg-slate-700">
        Voltar para o Login
      </a>
    } @else {
      <form (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-slate-300">E-mail cadastrado</label>
          <input
            id="email"
            type="email"
            required
            [(ngModel)]="email"
            name="email"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-600/30"
            placeholder="voce@exemplo.com"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full rounded-lg bg-violet-600 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ loading() ? 'Enviando...' : 'Enviar link de recuperação' }}
        </button>
      </form>
    }

    <p class="mt-6 text-center text-sm text-slate-400">
      Lembrou a senha?
      <a routerLink="/login" class="font-semibold text-violet-400 hover:text-violet-300">Voltar para o Login</a>
    </p>
  </div>
</main>
