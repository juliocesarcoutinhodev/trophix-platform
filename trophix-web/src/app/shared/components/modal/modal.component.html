@if (isOpen) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
    <!-- Overlay com Blur -->
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>
    
    <!-- Modal Card -->
    <div class="relative w-full max-w-sm transform overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl transition-all scale-100 opacity-100">
      
      <!-- Cabeçalho (com cores dinâmicas baseadas no tipo) -->
      <div class="flex items-center gap-3 border-b border-slate-800 px-6 py-4"
           [class.bg-emerald-500/10]="type === 'success'"
           [class.bg-red-500/10]="type === 'error'"
           [class.bg-amber-500/10]="type === 'warning'"
           [class.bg-violet-500/10]="type === 'info'">
        
        <!-- Ícones dinâmicos -->
        @if (type === 'success') {
          <svg class="h-6 w-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        @if (type === 'error') {
          <svg class="h-6 w-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        @if (type === 'warning') {
          <svg class="h-6 w-6 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        }
        @if (type === 'info') {
          <svg class="h-6 w-6 text-violet-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        
        <h3 class="text-lg font-bold text-slate-100">{{ title }}</h3>
      </div>
      
      <!-- Corpo -->
      <div class="px-6 py-5">
        <p class="text-sm text-slate-300 leading-relaxed">{{ message }}</p>
      </div>
      
      <!-- Rodapé / Botão -->
      <div class="bg-slate-950/50 px-6 py-4 flex justify-end">
        <button type="button" (click)="closeModal()"
                class="rounded-lg px-6 py-2.5 text-sm font-bold text-white shadow-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900"
                [class.bg-emerald-600]="type === 'success'" [class.hover:bg-emerald-500]="type === 'success'" [class.focus:ring-emerald-500]="type === 'success'"
                [class.bg-red-600]="type === 'error'" [class.hover:bg-red-500]="type === 'error'" [class.focus:ring-red-500]="type === 'error'"
                [class.bg-amber-600]="type === 'warning'" [class.hover:bg-amber-500]="type === 'warning'" [class.focus:ring-amber-500]="type === 'warning'"
                [class.bg-violet-600]="type === 'info'" [class.hover:bg-violet-500]="type === 'info'" [class.focus:ring-violet-500]="type === 'info'">
          {{ confirmText }}
        </button>
      </div>
      
    </div>
  </div>
}
