<div class="flex h-screen w-full flex-col bg-slate-900">
  
  <!-- Full-width Top Navbar -->
  <header class="flex h-16 shrink-0 items-center justify-between border-b border-slate-800 bg-slate-950 px-6 z-20 shadow-md shadow-black/20">
    <div class="flex items-center gap-5">
      <!-- Hamburger Menu Icon -->
      <button (click)="toggleSidebar()" class="text-slate-400 hover:text-white transition-colors">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      
      <!-- Logo -->
      <a routerLink="/admin/dashboard" class="flex items-center gap-2 text-xl font-black tracking-tight text-slate-100">
        <svg class="h-6 w-6 text-violet-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <span>TROPHIX <span class="text-violet-500">ADMIN</span></span>
      </a>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-5 text-slate-400">
      <a routerLink="/" class="hover:text-white transition-colors" title="Voltar ao Site Público">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </a>

      @if (auth.userSignal(); as u) {
        <div class="relative" #dropdownContainer>
          <button (click)="toggleDropdown()" class="flex items-center gap-2 rounded-full transition-colors hover:text-white">
            <img [src]="u.avatarUrl || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + u.username" class="h-8 w-8 rounded-full bg-slate-800 ring-2 ring-transparent hover:ring-violet-500 transition-all" />
          </button>
          
          @if (dropdownOpen()) {
            <div class="absolute right-0 mt-2 w-48 overflow-hidden rounded-lg border border-slate-800 bg-slate-900 shadow-xl z-50">
              <div class="px-4 py-3 border-b border-slate-700">
                <p class="text-sm text-slate-300">Logado como</p>
                <p class="truncate text-sm font-bold text-white">{{ u.username }}</p>
              </div>
              <a routerLink="/" (click)="dropdownOpen.set(false)" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white">Voltar ao Site</a>
              <button (click)="auth.logout()" class="block w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-slate-700 hover:text-red-300 border-t border-slate-800">Sair do Painel</button>
            </div>
          }
        </div>
      }
    </div>
  </header>

  <!-- Bottom Area: Sidebar + Content -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar -->
    <aside [class.w-64]="sidebarExpanded()" [class.w-0]="!sidebarExpanded()" class="flex shrink-0 flex-col overflow-y-auto border-slate-800 bg-slate-950 scrollbar-thin scrollbar-track-slate-950 scrollbar-thumb-slate-800 shadow-[4px_0_24px_-10px_rgba(0,0,0,0.5)] z-10 transition-[width] duration-300 ease-in-out whitespace-nowrap overflow-hidden border-r">
      
      <div class="mb-2 px-2 text-xs font-bold uppercase tracking-wider text-slate-500 mt-2">Home</div>
      <a routerLink="/admin/dashboard" routerLinkActive="bg-violet-600/10 text-violet-400 font-bold border-l-2 border-violet-500" class="flex items-center gap-3 rounded-r-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-slate-100 mb-1 border-l-2 border-transparent">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        Visão Geral
      </a>

      <div class="mb-2 px-2 text-xs font-bold uppercase tracking-wider text-slate-500 mt-6">Gestão</div>
      <a routerLink="/admin/users" routerLinkActive="bg-violet-600/10 text-violet-400 font-bold border-l-2 border-violet-500" class="flex items-center gap-3 rounded-r-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-slate-100 mb-1 border-l-2 border-transparent">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        Usuários
      </a>

      <a routerLink="/admin/guides" routerLinkActive="bg-violet-600/10 text-violet-400 font-bold border-l-2 border-violet-500" class="flex items-center gap-3 rounded-r-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-slate-100 mb-1 border-l-2 border-transparent">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        Moderação de Guias
      </a>

      <div class="mb-2 px-2 text-xs font-bold uppercase tracking-wider text-slate-500 mt-6">Sistema</div>
      <a routerLink="/admin/settings" routerLinkActive="bg-violet-600/10 text-violet-400 font-bold border-l-2 border-violet-500" class="flex items-center gap-3 rounded-r-lg px-3 py-2.5 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-slate-100 border-l-2 border-transparent">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Configurações
      </a>
    </aside>

    <!-- Main Content Scrollable Area -->
    <main class="flex-1 flex flex-col overflow-y-auto p-8 scrollbar-thin scrollbar-track-slate-900 scrollbar-thumb-slate-700 bg-slate-900">
      <div class="flex-1">
        <router-outlet></router-outlet>
      </div>

      <!-- Simple Admin Footer -->
      <footer class="mt-8 border-t border-slate-800/80 pt-6 flex justify-end text-sm text-slate-400">
        <div class="font-medium">
          TROPHIX ADMIN by <span class="text-violet-500">Trophix Team</span>
        </div>
      </footer>
    </main>

  </div>
</div>
